name: Monitor Cancilleria

on:
  schedule:
    # Se ejecuta al minuto 0 de cada hora (formato Cron UTC)
    - cron: '0 * * * *'
  # Permite ejecutarlo manualmente desde la pestaña Actions de GitHub
  workflow_dispatch:

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps

      - name: Ejecutar script de verificación
        env:
          CEDULA: ${{ secrets.CEDULA }}
          CORREO: ${{ secrets.CORREO }}
          FECHA_EXPEDICION: ${{ secrets.FECHA_EXPEDICION }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python monitor_cancilleria.py
